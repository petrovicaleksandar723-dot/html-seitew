[/Script/EngineSettings.GameMapsSettings]
; Use our procedural GameMode in every level — no per-map setup needed.
GlobalDefaultGameMode=/Script/LumenArena.LumenArenaGameMode

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
; DX12 is required for Lumen, Nanite, Virtual Shadow Maps and hardware ray tracing.
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12

[/Script/Engine.RendererSettings]
; ---- Cinematic / Triple-A defaults ----
; Lumen dynamic global illumination + reflections
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.HardwareRayTracing=False
r.RayTracing=False
; Fully dynamic lighting (no baked lightmaps) so Lumen owns the scene
r.AllowStaticLighting=False
; Distance fields feed Lumen + soft shadows
r.GenerateMeshDistanceFields=True
; Nanite virtualized geometry
r.Nanite.ProjectEnabled=True
; Virtual Shadow Maps for crisp, high-res dynamic shadows
r.Shadow.Virtual.Enable=1
; Temporal Super Resolution (best-in-class upscaling/AA)
r.AntiAliasingMethod=4
; Cinematic post defaults
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.AutoExposure.Method=0
r.DefaultFeature.Bloom=True
r.DefaultFeature.MotionBlur=True
r.DefaultFeature.AmbientOcclusion=True
r.DefaultFeature.LensFlare=True
r.BloomQuality=5
r.MotionBlurQuality=4
r.Tonemapper.Quality=5
; Screen-space + Lumen reflection quality
r.Lumen.Reflections.Allow=1
r.Lumen.ScreenProbeGather.RadianceCache=1
; Shading
r.GBufferFormat=1
r.DefaultFeature.LightUnits=2

[/Script/Engine.RendererOverrideSettings]
; (left for project overrides)

[/Script/Engine.Engine]
bSmoothFrameRate=True
