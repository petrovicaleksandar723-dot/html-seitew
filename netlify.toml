[build]
  # Static site — no build step, the repo root is published as-is.
  publish = "."
  command = ""

# Long-cache the heavy media so repeat visits are instant.
[[headers]]
  for = "/assets/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
